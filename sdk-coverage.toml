# Intentional Connect RPC omissions for this API-key SDK.
# Every public gen procedure must be either wrapped or listed here.
# CI: python3 scripts/check_sdk_coverage.py

[[allowlist]]
service = "auth.v1.MFAService"
reason = "MFA enrollment and step-up are outside the API-key SDK surface."

[[allowlist]]
procedure = "/auth.v1.AuthService/CreateWalletChallenge"
reason = "Wallet login is intentionally outside the API-key SDK surface."

[[allowlist]]
procedure = "/auth.v1.AuthService/LoginWithWallet"
reason = "Wallet login is intentionally outside the API-key SDK surface."

[[allowlist]]
service = "auth.v1.PolicyService"
reason = "Policy writes are session-only. API keys may read policies (ListApiPolicies/GetApiPolicy with READ_API_POLICIES, ListSubaccountPolicies/GetSubaccountPolicy with READ_SUBACCOUNT_POLICIES), but the unary reads are not wrapped yet; this SDK exposes the policy subscriptions."

[[allowlist]]
service = "auth.v1.ResolveService"
reason = "ResolveAccount accepts API keys with READ_ACCOUNT_DIRECTORY but is not wrapped in this SDK yet."

[[allowlist]]
service = "auth.v1.ProfileService"
reason = "Profile writes and username generation are session-only. GetProfile and GetUsernameHistory accept main-account API keys with READ_PROFILE but are not wrapped yet; this SDK keeps the identity subscription."

[[allowlist]]
procedure = "/auth.v1.ApiKeyService/CreateApiKey"
reason = "API key create/update/delete are JWT/session-only; list/get/subscribe remain."

[[allowlist]]
procedure = "/auth.v1.ApiKeyService/UpdateApiKey"
reason = "API key create/update/delete are JWT/session-only; list/get/subscribe remain."

[[allowlist]]
procedure = "/auth.v1.ApiKeyService/DeleteApiKey"
reason = "API key create/update/delete are JWT/session-only; list/get/subscribe remain."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/CreateSubaccount"
reason = "Subaccount mutations and invite/member writes are JWT/session-only."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/CreateSubaccountChallenge"
reason = "Subaccount mutations and invite/member writes are JWT/session-only."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/UpdateSubaccount"
reason = "Subaccount mutations and invite/member writes are JWT/session-only."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/SetSubaccountMemberMFARequirement"
reason = "Subaccount mutations and invite/member writes are JWT/session-only."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/RemoveSubaccountMember"
reason = "Subaccount mutations and invite/member writes are JWT/session-only."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/UpdateSubaccountMemberRole"
reason = "Subaccount mutations and invite/member writes are JWT/session-only."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/InviteSubaccountMember"
reason = "Subaccount mutations and invite/member writes are JWT/session-only."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/RespondSubaccountInvite"
reason = "Subaccount mutations and invite/member writes are JWT/session-only."

[[allowlist]]
service = "auth.v1.SubaccountRoleService"
reason = "The subaccount role catalog is not wrapped. GetEffectiveSubaccountPermissions accepts API keys with READ_SUBACCOUNT_PERMISSIONS but is not wrapped in this SDK yet."

[[allowlist]]
procedure = "/ledger.read.v1.LedgerReadService/GetPortfolioEquityHistorySeries"
reason = "Root portfolio equity history requires an interactive root-account session; API keys and subaccount-scoped sessions are not supported."

[[allowlist]]
procedure = "/ledger.read.v1.LedgerReadService/GetPortfolioEquitySnapshot"
reason = "Root portfolio equity snapshot requires an interactive root-account session; API keys and subaccount-scoped sessions are not supported."

[[allowlist]]
procedure = "/auth.v1.AuthService/AcceptTerms"
reason = "Terms acceptance requires an interactive JWT session; API keys are not supported."

[[allowlist]]
service = "claims.v1.ClaimsService"
reason = "Daily claims accept main-account API keys (GetDailyClaimStatus with READ_DAILY_CLAIMS, ClaimDailyReward with CLAIM_DAILY_REWARD) but are not wrapped in this SDK yet."

[[allowlist]]
service = "rewards.v1.RewardCampaignService"
reason = "AcknowledgeMyRewardAward and SetMyRewardDestination are session-only. ListMyRewardAwards accepts main-account API keys with READ_REWARDS but is not wrapped in this SDK yet."

[[allowlist]]
service = "swap.quickswap.v1.QuickSwapService"
reason = "Quick Swap authenticates with a broker API key, which is outside the API-key SDK surface."

[[allowlist]]
service = "swap.quickswap.v1.QuickSwapBrokerService"
reason = "Quick Swap broker management authenticates with a broker API key or an interactive session; outside the API-key SDK surface."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/SetAutoWithdrawRule"
reason = "Auto-withdraw rule changes require an interactive session with a fresh MFA step-up; API keys are not accepted."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/GetAutoWithdrawRule"
reason = "Auto-withdraw rule reads are not wrapped in the API-key SDK."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/ListAutoWithdrawRuns"
reason = "Auto-withdraw run reads are not wrapped in the API-key SDK."

[[allowlist]]
service = "swap.v1.SwapService"
reason = "Swap quote, create and get are not wrapped in the API-key SDK."

[[allowlist]]
procedure = "/checkpoints.v1.CheckpointService/ListMyCheckpoints"
reason = "ListMyCheckpoints accepts main-account API keys with READ_CHECKPOINTS but is not wrapped in this SDK yet."

[[allowlist]]
procedure = "/transfer.v1.InternalTransferService/GetInternalTransfer"
reason = "Internal transfer lookup requires an interactive session; the contract does not accept API keys for it. CreateInternalTransfer returns the flow ID."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/SetAutoWithdrawRuleEnabled"
reason = "Pausing and resuming an auto-withdraw rule requires an interactive session (resuming also a fresh MFA step-up); API keys are not accepted."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/PreviewAutoWithdrawRun"
reason = "The auto-withdraw run preview accepts API keys with READ_AUTO_WITHDRAW but is not wrapped in this SDK, like the other auto-withdraw reads."

[[allowlist]]
service = "ai.v1.AssistantService"
reason = "The Polyester assistant accepts only interactive session tokens; API keys are not accepted. Devnet only."


