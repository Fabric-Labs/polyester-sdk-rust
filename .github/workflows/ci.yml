name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # publish.yml runs these same checks before it publishes a tag.
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.90 toolchain
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Reject private ledger.write gen
        run: |
          if [ -d src/gen/buffa ] && grep -Rql 'ledger\.write\.v1' src/gen; then
            echo "private ledger.write.v1 must not appear in public SDK gen/" >&2
            exit 1
          fi

      - name: Public disclosure (README / CHANGELOG)
        run: python3 scripts/check_public_disclosure.py

      - name: Generated module tree is current
        run: |
          python3 scripts/gen_module_tree.py
          git add --intent-to-add src/proto src/connect_gen
          if ! git diff --exit-code -- src/proto src/connect_gen; then
            echo "src/proto or src/connect_gen is stale; run python3 scripts/gen_module_tree.py and commit the result" >&2
            exit 1
          fi

      # Fails when sdk-capabilities.json or the README capability table is stale.
      # CI never commits; run --write-capabilities locally and commit the result.
      - name: SDK Connect coverage and capability artifacts
        run: python3 scripts/check_sdk_coverage.py

      - name: Refresh public capability matrix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FABRIC_APPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FABRIC_APPS_DISPATCH_TOKEN unset; skipping capability matrix dispatch"
            exit 0
          fi
          gh api repos/Fabric-Labs/fabric-apps/dispatches \
            -f event_type=sdk-coverage-refresh \
            -f 'client_payload[sdk]=rust' \
            -f 'client_payload[sha]=${{ github.sha }}'

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Required PR gate: unit/UI plus deterministic local HTTP/WS L2 tests.
      # Credentialed staging tests remain a separate fail-closed release job.
      - name: Test unit and local L2
        run: cargo test --all-features --lib --test ui --test hardening --test a7_strict_live --test price_fixtures
