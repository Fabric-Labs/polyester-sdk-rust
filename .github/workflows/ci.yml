name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Reject private ledger.write gen
        run: |
          if [ -d src/gen/buffa ] && grep -Rql 'ledger\.write\.v1' src/gen; then
            echo "private ledger.write.v1 must not appear in public SDK gen/" >&2
            exit 1
          fi

      - name: SDK Connect coverage
        run: python3 scripts/check_sdk_coverage.py

      - name: Refresh internal coverage scoreboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FABRIC_CONTEXT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FABRIC_CONTEXT_DISPATCH_TOKEN unset; skipping scoreboard dispatch"
            exit 0
          fi
          gh api repos/Fabric-Labs/fabric-context/dispatches \
            -f event_type=sdk-coverage-refresh \
            -f 'client_payload[sdk]=rust' \
            -f 'client_payload[sha]=${{ github.sha }}'

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-features
