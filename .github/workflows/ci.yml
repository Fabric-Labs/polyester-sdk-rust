name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Reject private ledger.write gen
        run: |
          if [ -d src/gen/buffa ] && grep -Rql 'ledger\.write\.v1' src/gen; then
            echo "private ledger.write.v1 must not appear in public SDK gen/" >&2
            exit 1
          fi

      - name: Refresh SDK capability artifacts
        run: python3 scripts/check_sdk_coverage.py --write-capabilities

      - name: Commit capability artifacts if changed
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk-capabilities.json README.md
          if git diff --staged --quiet; then
            echo "capability artifacts unchanged"
            exit 0
          fi
          git commit -m "chore: refresh sdk-capabilities and README table"
          git push

      - name: SDK Connect coverage
        run: python3 scripts/check_sdk_coverage.py

      - name: Refresh public capability matrix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FABRIC_APPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FABRIC_APPS_DISPATCH_TOKEN unset; skipping capability matrix dispatch"
            exit 0
          fi
          gh api repos/Fabric-Labs/fabric-apps/dispatches \
            -f event_type=sdk-coverage-refresh \
            -f 'client_payload[sdk]=rust' \
            -f 'client_payload[sha]=${{ github.sha }}'

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-features
