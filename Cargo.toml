[package]
name = "polyester-sdk"
version = "0.1.0-alpha.22"
edition = "2024"
rust-version = "1.88"
description = "Official Rust SDK for Polyester APIs."
readme = "README.md"
license-file = "LICENSE"
authors = ["Fabric Blockchain Labs Inc."]
repository = "https://github.com/Fabric-Labs/polyester-sdk-rust"
homepage = "https://github.com/Fabric-Labs/polyester-sdk-rust"
documentation = "https://docs.rs/polyester-sdk"
keywords = ["polyester", "trading", "sdk", "connectrpc", "protobuf"]
categories = ["api-bindings", "finance", "network-programming"]
exclude = [
  ".github/",
  "tests/integration/",
  "src/gen/buffa/gnostic.openapi.v3.rs",
  "src/gen/buffa/buf.validate.rs",
  "src/gen/buffa/google.api.rs",
]

[lib]
name = "polyester"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "hardening"
path = "tests/hardening.rs"

[[test]]
name = "a7_strict_live"
path = "tests/a7_strict_live.rs"

[features]
# Always-on stubs so existing `features = ["realtime"]` / `["chain"]` keep working.
realtime = []
chain = []

[dependencies]
buffa = { version = "0.8.1", features = ["json"] }
buffa-descriptor = "0.8.1"
buffa-types = { version = "0.8", features = ["json"] }
connectrpc = { version = "0.8", features = ["client", "client-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
http = "1"
tower = { version = "0.5", features = ["util"] }
bytes = "1"
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
tracing = "0.1"
url = "2"
percent-encoding = "2"
http-body = "1"
http-body-util = "0.1"
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "native-tokio", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
alloy-primitives = { version = "1" }
alloy-sol-types = { version = "1" }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
dotenvy = "0.15"
trybuild = "1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
