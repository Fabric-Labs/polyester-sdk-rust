[package]
name = "polyester-sdk"
version = "0.33.0"
edition = "2024"
rust-version = "1.90"
description = "Rust SDK for the Polyester API with generated protobuf types and ConnectRPC clients."
readme = "README.md"
license = "Apache-2.0"
authors = ["Fabric Blockchain Labs Inc."]
repository = "https://github.com/Fabric-Labs/polyester-sdk-rust"
homepage = "https://github.com/Fabric-Labs/polyester-sdk-rust"
documentation = "https://polyester.com/docs/sdk/rust/get-started/overview"
keywords = ["polyester", "trading", "sdk", "connectrpc", "protobuf"]
categories = ["api-bindings", "finance", "network-programming"]
exclude = [
  ".github/",
  "tests/integration/",
  "src/gen/buffa/gnostic.openapi.v3.rs",
  "src/gen/buffa/buf.validate.rs",
  "src/gen/buffa/google.api.rs",
]

[lib]
name = "polyester"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "hardening"
path = "tests/hardening.rs"

[[test]]
name = "a7_strict_live"
path = "tests/a7_strict_live.rs"

[[test]]
name = "price_fixtures"
path = "tests/price_fixtures.rs"

[dependencies]
buffa = { version = "0.8.1", features = ["json"] }
buffa-types = { version = "0.8", features = ["json"] }
# Without default features: no zstd (the C library), only gzip and identity.
# `json` backs `WireFormat::Json`.
connectrpc = { version = "0.8.2", default-features = false, features = ["client", "client-tls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
http = "1"
tower = { version = "0.5", features = ["util"] }
bytes = "1"
thiserror = "2"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
sha2 = "0.11"
hex = "0.4"
bs58 = "0.5"
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde"] }
tracing = "0.1"
url = "2.5.9"
percent-encoding = "2"
http-body = "1"
http-body-util = "0.1"
webpki-roots = "1.0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false }
alloy-primitives = { version = "1" }
alloy-sol-types = { version = "1" }
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
# Not used directly: a floor for k256's elliptic-curve. elliptic-curve 0.14.3
# requires crypto-bigint ^0.7.8, past the timing fixes of RUSTSEC-2026-0387;
# k256 0.14.0 alone still accepts the affected crypto-bigint 0.7.5.
elliptic-curve = { version = "0.14.3", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
httparse = "1"
dotenvy = "0.15"
trybuild = "1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
